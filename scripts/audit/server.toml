# The settings every audited server gets.
#
# **Never copy this into a workspace `ya-lsp.toml`.** A corpus is a clone pinned to a commit, and
# `config.check_clean` refuses to measure a dirty one. So the audit configures its servers the way
# an editor does, through `initializationOptions`, and writes nothing into any corpus.
#
# **Use the server's own spellings** (`workspace::config::PartialConfig`). It deserializes this
# with `deny_unknown_fields`, so one unknown key rejects the whole layer, and every setting in it
# silently stops applying.
#
# A workspace `ya-lsp.toml` would outrank all of this. No corpus has one.

[log]
# A finding is a corpus, a path and an offset. The log is what the server did with it: whether
# the request arrived, whether it settled first, how long it took, what it answered. Without it,
# the only way to find out is to re-run the position by hand.
#
# **On, because it is nearly free**, measured: a fraction of a second per corpus. Turn it off if a
# corpus ever makes that untrue, and record the number that showed it.
file = true
# **Relative to the ya-lsp checkout, not the corpus**, resolved by `config.server_options` before
# it is sent. Every corpus gitignores `tmp` today, but only this reading guarantees the log never
# lands inside a pinned clone, whatever a corpus' `.gitignore` becomes upstream.
#
# One file for all six servers. `O_APPEND` and the pid on every line keep it readable: the same
# two properties two editor windows on one project rely on.
file_path = "tmp/ya-lsp.log"
# The whole point of the file. `level` is left alone on purpose: `client.py` sets `YA_LSP_LOG`,
# which outranks `log.level` and decides stderr only, so nothing here changes the sweep's console
# output.
file_level = "debug"
