# Which licences may appear in the dependency graph. An unlisted one fails generation instead of
# landing quietly in a shipped notice: the list turns "we picked up a new dependency" into a
# decision somebody makes.
#
# Order matters: for a crate offered under several licences, the first entry here that satisfies
# its expression is elected, and its text is the one reproduced. MIT leads because almost the
# whole tree is `MIT OR Apache-2.0`, and MIT is shorter and asks less of us.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# CC0-1.0 is here for one crate, `notify`: the one entry on this list that was a decision, not a
# formality.
# - What it means: a public-domain dedication with no attribution and no copyleft, so it sits
#   inside an MIT binary without conditions.
# - What is wrong with it: section 4(a) expressly does *not* waive the author's patent rights,
#   which is why OSI never approved it and Fedora stopped accepting it for code in 2022.
# - Why it is accepted: the risk is low and shared (rust-analyzer and watchexec ship the same
#   crate), and the alternative is no file watching for every client that cannot register one.

# Every platform a release is built for, so one generated notice is correct for all of them.
# Windows-only and Unix-only crates differ, and a notice generated on one machine must not miss
# the licences that ship on another.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# Neither ships in the binary, so neither owes a notice in it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# rubydex's crate has no licence file of its own (only `license = "MIT"` in its manifest), so
# `cargo about` would file it under the unfilled SPDX template, and **Shopify would be named
# nowhere in any shipped artifact**: the gap `NOTICE.txt` closes for rbs.
# - A git checkout carries the whole repository, so the root `LICENSE.txt` is there to harvest.
# - `../../` escapes the package directory, so if upstream moves the crate inside its repository
#   this breaks *silently*; `make notices-check`'s byte diff is what catches it.
# - Against a crates.io source it fails open (a warning and the template, at exit 0), so it
#   costs nothing if the pin ever goes back to a release.
[rubydex.clarify]
license = "MIT"

[[rubydex.clarify.files]]
path = "../../LICENSE.txt"
license = "MIT"
checksum = "d0636642cb7067953580a81350106e9bcead7f4e13bb4a65652ca8d9d690002e"
