# Which licences may appear in the dependency graph. An unlisted one fails generation rather
# than landing quietly in a shipped notice, which is the point of the list: it turns "we picked
# up a new dependency" into a decision somebody makes.
# Order matters: for a crate offered under several licences, the first entry here that satisfies
# its expression is the one elected — and the one whose text gets reproduced. MIT leads because
# almost the whole tree is `MIT OR Apache-2.0`, and MIT is shorter and asks less of us.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Every platform a release is built for, so one generated notice is correct for all six. The
# Windows-only and Unix-only crates differ, and a notice generated on one machine must not be
# missing the licences that ship on another.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# Neither ships in the binary, so neither owes a notice in it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# rubydex publishes no licence file of its own — only `license = "MIT"` in its manifest — so
# `cargo about` files it under the unfilled SPDX template and **Shopify is named nowhere in any
# shipped artifact**, which is exactly the gap `NOTICE.txt` closes for rbs. A git checkout carries
# the whole repository, so the root `LICENSE.txt` is there to harvest; the `../../` escapes the
# package directory, which means an upstream move of the crate inside its repository breaks this
# *silently* and `make notices-check`'s byte diff is what catches it. That is an argument for the
# check rather than against the clarification. Against a crates.io source it fails open — a
# warning and the template, at exit 0 — so it costs nothing if the pin ever goes back.
[rubydex.clarify]
license = "MIT"

[[rubydex.clarify.files]]
path = "../../LICENSE.txt"
license = "MIT"
checksum = "d0636642cb7067953580a81350106e9bcead7f4e13bb4a65652ca8d9d690002e"
